name: Release

# Bei einem Tag v<version> beide Plugins packen und als Release anhängen.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/pack.sh
      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "gisloader-Plugins $GITHUB_REF_NAME" \
            --notes "Blender (dcc/blender), Cinema 4D (dcc/cinema4d) und Rhino 8 (dcc/rhino). Anleitungen unter docs/." \
            dist/gisloader-blender.zip dist/gisloader-cinema4d.zip dist/gisloader-rhino.zip
