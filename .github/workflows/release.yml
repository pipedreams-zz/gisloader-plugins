name: Release

# Bei einem Tag (Datum wie 2026.09.09 oder v<x>) alle Plugins packen und als
# Release anhängen; die Notiz nennt die Version jedes Plugins.
on:
  push:
    tags: ["v*", "20*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/pack.sh
      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "gisloader-Plugins $GITHUB_REF_NAME" \
            --notes-file dist/RELEASE.md \
            dist/*.zip dist/*.yak
