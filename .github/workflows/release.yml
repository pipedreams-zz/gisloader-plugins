name: Release

# Bei einem Tag (Datum wie 2026.09.09 oder v<x>) alle Plugins packen und als
# Release anhängen; die Notiz nennt die Version jedes Plugins. Die Zips heißen
# gisloader_<plugin>-<zielprogramm>_v<version>_<datum>.zip (dcc/release.json).
# Die Versionstags <plugin>-v<version> setzt der Spiegel-Workflow im
# gisloader-Repo (scripts/version-tags.sh): das Workflow-Token hier darf keine
# Tags auf Commits mit älteren Workflow-Dateien anlegen.
on:
  push:
    tags: ["v*", "20*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/pack.sh
      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "gisloader-Plugins $GITHUB_REF_NAME" \
            --notes-file dist/RELEASE.md \
            dist/*.zip dist/*.yak
